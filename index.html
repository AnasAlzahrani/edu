<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Saudi Arabian Sand Simulation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0e0804;
    margin: 0; height: 100vh; overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #e8d5b7;
    touch-action: none;
  }
  #overlay {
    position: absolute; top: 0; left: 0; right: 0;
    text-align: center; padding: 12px 0 6px;
    pointer-events: none; z-index: 10;
  }
  h1 {
    font-size: 1.4rem; text-shadow: 0 0 14px rgba(255,180,60,0.5);
    letter-spacing: 3px; margin: 0;
  }
  #subtitle { font-size: 0.85rem; opacity: 0.5; direction: rtl; margin-top: 2px; }
  #info { font-size: 0.6rem; opacity: 0.35; margin-top: 4px; }
  canvas {
    display: block; width: 100vw; height: 100vh;
    cursor: none; image-rendering: pixelated;
  }
</style>
</head>
<body>

<div id="overlay">
  <h1>Sand of Saudi Arabia</h1>
  <div id="subtitle">رمال المملكة العربية السعودية</div>
  <div id="info">Move cursor to push sand around</div>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Fullscreen, 1 pixel = 1 grain
const COLS = window.innerWidth;
const ROWS = window.innerHeight;
canvas.width = COLS;
canvas.height = ROWS;

// Materials
const EMPTY = 0, RUB = 1, NAFUD = 2, DAHNA = 3, HEJAZ = 4;

function isSand(t) { return t >= RUB && t <= HEJAZ; }

const total = COLS * ROWS;
let grid = new Uint8Array(total);
let color = new Uint32Array(total);
let imageData = ctx.createImageData(COLS, ROWS);
let pixels = new Uint32Array(imageData.data.buffer);
let updated = new Uint8Array(total);

// Packed ABGR colors for ImageData
function packRGB(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return (255 << 24) | (b << 16) | (g << 8) | r;
}

const palettes = {
  [RUB]:   ['#e8a840','#d49530','#f0b848','#c88a28','#dca038','#e0a035','#d89828','#ecb040','#d4a030','#e8b038'].map(packRGB),
  [NAFUD]: ['#f0d0a0','#e8c490','#f5d8a8','#ddb888','#f2cca0','#eac898','#f4d4a4','#e0c090','#f0cc98','#e4c888'].map(packRGB),
  [DAHNA]: ['#c86030','#b85028','#d47038','#a84820','#d06840','#c05828','#b84e20','#d87040','#c45830','#b85830'].map(packRGB),
  [HEJAZ]: ['#3a3530','#302b28','#454038','#282420','#4a4540','#343030','#3e3a35','#2c2820','#363230','#403c38'].map(packRGB),
};

function randomColor(type) {
  const p = palettes[type];
  return p[(Math.random() * p.length) | 0];
}

const bgColor = packRGB('#100a05');

// Sand types cycle through in bands, weighted toward Rub' al Khali
const sandTypes = [RUB, RUB, RUB, NAFUD, NAFUD, DAHNA, DAHNA, HEJAZ];

// --- Pour configuration ---
// Multiple pour streams from the top
const NUM_STREAMS = 5;
let streams = [];
for (let i = 0; i < NUM_STREAMS; i++) {
  streams.push({
    x: ((i + 0.5) / NUM_STREAMS) * COLS | 0,
    width: 20 + Math.random() * 30 | 0,
    type: sandTypes[(Math.random() * sandTypes.length) | 0],
    density: 0.15 + Math.random() * 0.2,
    drift: (Math.random() - 0.5) * 0.3,
  });
}

// Slowly drift streams and occasionally change sand type
let frameCount = 0;

function pourSand() {
  frameCount++;

  for (const s of streams) {
    // Drift stream position slowly
    s.x += s.drift;
    if (s.x < s.width) s.drift = Math.abs(s.drift);
    if (s.x > COLS - s.width) s.drift = -Math.abs(s.drift);

    // Occasionally change type for layered look
    if (frameCount % 300 === 0 && Math.random() < 0.3) {
      s.type = sandTypes[(Math.random() * sandTypes.length) | 0];
    }

    // Pour grains at the top row
    const hw = s.width >> 1;
    for (let dx = -hw; dx <= hw; dx++) {
      const px = (s.x + dx) | 0;
      if (px < 0 || px >= COLS) continue;
      // Gaussian-ish density — denser in center
      const falloff = 1 - (dx * dx) / (hw * hw + 1);
      if (Math.random() > s.density * falloff) continue;
      const pi = px; // row 0
      if (grid[pi] === EMPTY) {
        grid[pi] = s.type;
        color[pi] = randomColor(s.type);
      }
    }
  }
}

// --- Mouse: push sand around like dragging finger through real sand ---
let mx = -1, my = -1, pmx = -1, pmy = -1;
const PUSH_RADIUS = 18;

function canvasXY(e) {
  const rect = canvas.getBoundingClientRect();
  return [
    ((e.clientX - rect.left) * COLS / rect.width) | 0,
    ((e.clientY - rect.top) * ROWS / rect.height) | 0
  ];
}

canvas.addEventListener('mousemove', e => { const [x,y]=canvasXY(e); pmx=mx; pmy=my; mx=x; my=y; });
canvas.addEventListener('mouseleave', () => { mx=-1; my=-1; });
canvas.addEventListener('touchstart', e => { e.preventDefault(); const t=e.touches[0]; const [x,y]=canvasXY(t); mx=x; my=y; pmx=x; pmy=y; }, {passive:false});
canvas.addEventListener('touchmove', e => { e.preventDefault(); const t=e.touches[0]; const [x,y]=canvasXY(t); pmx=mx; pmy=my; mx=x; my=y; }, {passive:false});
canvas.addEventListener('touchend', e => { e.preventDefault(); mx=-1; my=-1; }, {passive:false});

function pushSand() {
  if (mx < 0 || my < 0 || pmx < 0) return;

  const vx = mx - pmx;
  const vy = my - pmy;
  const speed = Math.sqrt(vx * vx + vy * vy);
  if (speed < 0.8) return;

  const nx = vx / speed;
  const ny = vy / speed;
  const force = Math.min(speed, 16);
  const r = PUSH_RADIUS;

  // Interpolate along cursor path for smooth push
  const steps = Math.max(speed | 0, 1);
  for (let s = 0; s <= steps; s++) {
    const t = s / steps;
    const cx = (pmx + vx * t) | 0;
    const cy = (pmy + vy * t) | 0;

    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        const d2 = dx * dx + dy * dy;
        if (d2 > r * r) continue;
        const sx = cx + dx;
        const sy = cy + dy;
        if (sx < 0 || sx >= COLS || sy < 0 || sy >= ROWS) continue;
        const si = sy * COLS + sx;
        if (!isSand(grid[si])) continue;

        // Closer to center = stronger push
        const strength = 1 - Math.sqrt(d2) / r;
        const spread = (Math.random() - 0.5) * 0.8;
        const pnx = nx + spread * (-ny);
        const pny = ny + spread * nx;
        const dist = (1 + strength * force * (0.5 + Math.random() * 0.5)) | 0;

        let bx = sx, by = sy;
        for (let step = 1; step <= dist; step++) {
          const tx = (sx + pnx * step) | 0;
          const ty = (sy + pny * step) | 0;
          if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) break;
          if (grid[ty * COLS + tx] === EMPTY) { bx = tx; by = ty; }
          else break;
        }

        if (bx !== sx || by !== sy) {
          const di = by * COLS + bx;
          grid[di] = grid[si]; color[di] = color[si];
          grid[si] = EMPTY; color[si] = 0;
        }
      }
    }
  }
}

// --- Physics ---
function simulate() {
  updated.fill(0);

  for (let y = ROWS - 2; y >= 0; y--) {
    const leftToRight = (y & 1);
    for (let i = 0; i < COLS; i++) {
      const x = leftToRight ? i : COLS - 1 - i;
      const ci = y * COLS + x;
      if (updated[ci]) continue;
      const cell = grid[ci];
      if (!isSand(cell)) continue;

      const below = ci + COLS;

      // Fall straight down
      if (grid[below] === EMPTY) {
        grid[below] = cell; color[below] = color[ci];
        grid[ci] = EMPTY; color[ci] = 0;
        updated[below] = 1; updated[ci] = 1;
        continue;
      }

      // Diagonal slide
      const goLeft = Math.random() > 0.5;
      for (const ddx of goLeft ? [-1,1] : [1,-1]) {
        const nx = x + ddx;
        if (nx < 0 || nx >= COLS) continue;
        const ni = below + ddx;
        if (grid[ni] === EMPTY) {
          grid[ni] = cell; color[ni] = color[ci];
          grid[ci] = EMPTY; color[ci] = 0;
          updated[ni] = 1; updated[ci] = 1;
          break;
        }
      }
    }
  }
}

// --- Render ---
function draw() {
  for (let i = 0; i < total; i++) {
    pixels[i] = grid[i] === EMPTY ? bgColor : color[i];
  }
  ctx.putImageData(imageData, 0, 0);

  // Subtle cursor glow
  if (mx >= 0 && my >= 0) {
    ctx.strokeStyle = 'rgba(255,220,150,0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(mx, my, PUSH_RADIUS, 0, Math.PI * 2);
    ctx.stroke();
  }
}

// --- Main loop ---
function loop() {
  pourSand();
  pushSand();
  simulate();
  simulate();
  simulate();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
